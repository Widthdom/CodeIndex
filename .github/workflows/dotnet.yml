name: Build and Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'CLAUDE.md'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'CLAUDE.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        test-framework: [net8.0, net9.0]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The Windows lane is still dominated by temp-heavy test I/O even after
      # the Defender exclusions from #394. Pinning TMP/TEMP to RUNNER_TEMP
      # moves Path.GetTempPath()-driven fixtures onto the same faster, already
      # CI-owned volume as the checkout workspace instead of the default user
      # profile temp under C:\Users\runneradmin\AppData\Local\Temp.
      # GITHUB_ENV is written before the Defender-exclusion step so the later
      # verification sees the actual effective TMP/TEMP/GetTempPath values.
      # Windows lane は #394 の Defender 除外後も temp-heavy なテスト I/O が
      # 支配的なため、TMP/TEMP を RUNNER_TEMP 配下へ固定する。これにより
      # Path.GetTempPath() を使う fixture 群が、既定の
      # C:\Users\runneradmin\AppData\Local\Temp ではなく checkout と同じ
      # CI 管理下の高速ボリュームを使う。Defender 除外 step より前に
      # GITHUB_ENV へ書き込むことで、後続の検証が実際の TMP/TEMP /
      # GetTempPath 値をそのまま確認できるようにする。
      - name: Pin Windows TMP/TEMP to runner temp
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tempRoot = Join-Path $env:RUNNER_TEMP "cdidx-temp"
          New-Item -ItemType Directory -Force -Path $tempRoot | Out-Null

          "TMP=$tempRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$tempRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $env:TMP = $tempRoot
          $env:TEMP = $tempRoot
          Write-Host "Pinned Windows TMP/TEMP to: $tempRoot"
          Write-Host ".NET Path.GetTempPath() now resolves to: $([System.IO.Path]::GetTempPath())"

      # Windows Defender real-time scanning of every temp file created by the
      # test suite (temp projects, SQLite DBs, .cdidx directories, synthetic
      # source files) dominates the Windows lane of this matrix; see issue #394.
      # Excluding the workspace plus the effective temp roots before build/test
      # and the immutable NuGet global package cache keeps Defender from
      # repeatedly scanning the restore/build inputs that dotnet touches on
      # Windows. This also prevents silent regression if the runner image or
      # TMP/TEMP wiring changes again in the future.
      # We rely on -ExclusionPath only: -ExclusionProcess expects full image
      # paths, so bare filenames like 'dotnet.exe' would silently fail to take
      # effect. We include $env:TMP and the live [IO.Path]::GetTempPath() value
      # in addition to $env:TEMP / RUNNER_TEMP because .NET's Path.GetTempPath()
      # consults TMP before TEMP and may resolve to a path that differs from
      # $env:TEMP in pwsh. Paths are trimmed of trailing separators so the
      # Get-MpPreference -notcontains check matches the stored form exactly.
      # Every Add-MpPreference call uses -ErrorAction Stop, and a final
      # Get-MpPreference verification throws if any exclusion did not register
      # so the step fails loudly instead of degrading silently. A reason-coded
      # audit table of effective exclusions is emitted to both the log and job
      # summary so future investigations can see exactly which paths were
      # covered and why each path was required.
      # テストスイートが大量に作る一時ファイル（temp project / SQLite DB /
      # .cdidx / 合成ソース）を Windows Defender が都度スキャンする影響で
      # Windows lane だけ極端に遅くなる（issue #394）。build/test 前に
      # workspace と実効 temp root 群に加えて変更されない NuGet global package
      # cache も除外し、Windows で dotnet が繰り返し触る restore/build 入力を
      # Defender に再スキャンさせない。これで runner image や TMP/TEMP の
      # 配線が今後変わっても silent regression しないようにする。
      # -ExclusionProcess はフルパスを要求する仕様のため、bare filename では
      # 黙って no-op になる。ここでは -ExclusionPath だけに寄せる。.NET の
      # Path.GetTempPath() は TMP → TEMP → USERPROFILE の順で参照し、pwsh の
      # $env:TEMP と異なるパスへ解決されうるため、$env:TMP と実行時の
      # [IO.Path]::GetTempPath() も追加でカバーする。末尾区切り文字を揃え、
      # Get-MpPreference -notcontains の照合を保存形式と完全一致させる。
      # 各呼び出しを -ErrorAction Stop で明示失敗させ、最後に Get-MpPreference
      # で登録を検証し、silent degradation を起こさないようにする。最終的に
      # 適用された除外パスは理由付きの audit table としてログと job summary に
      # 出力し、どのパスをなぜ対象にしたかを追えるようにする。
      - name: Exclude workspace and temp paths from Windows Defender (Windows only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            [pscustomobject]@{
              Path = "${{ github.workspace }}"
              Reason = "Repository checkout containing build outputs and temp-heavy test fixtures."
            },
            [pscustomobject]@{
              Path = $env:RUNNER_TEMP
              Reason = "GitHub-hosted runner temp root used by actions and pinned TMP/TEMP."
            },
            [pscustomobject]@{
              Path = $env:TEMP
              Reason = "Effective TEMP path used by PowerShell and child processes."
            },
            [pscustomobject]@{
              Path = $env:TMP
              Reason = "Effective TMP path preferred by .NET Path.GetTempPath()."
            },
            [pscustomobject]@{
              Path = [System.IO.Path]::GetTempPath()
              Reason = "Runtime-observed .NET temp path, which can differ from environment variables."
            },
            [pscustomobject]@{
              Path = $env:NUGET_PACKAGES
              Reason = "Explicit NuGet global package cache when configured."
            },
            [pscustomobject]@{
              Path = (Join-Path $env:USERPROFILE ".nuget\packages")
              Reason = "Default user NuGet global package cache touched by restore/build."
            },
            [pscustomobject]@{
              Path = (Join-Path $env:LOCALAPPDATA "NuGet\packages")
              Reason = "Windows local NuGet package cache fallback touched by restore/build."
            }
          )

          $exclusions = $candidates |
            Where-Object { $_.Path } |
            ForEach-Object {
              $path = $_.Path.TrimEnd('\','/')
              if ($path) {
                [pscustomobject]@{
                  Path = $path
                  Reason = $_.Reason
                }
              }
            } |
            Group-Object -Property Path |
            ForEach-Object {
              [pscustomobject]@{
                Path = $_.Name
                Reason = (($_.Group | ForEach-Object { $_.Reason }) | Select-Object -Unique) -join " "
              }
            } |
            Sort-Object -Property Path

          Write-Host "Windows Defender exclusion audit:"
          foreach ($entry in $exclusions) {
            Write-Host ("  {0} -- {1}" -f $entry.Path, $entry.Reason)
          }

          if ($env:GITHUB_STEP_SUMMARY) {
            "### Windows Defender exclusion audit" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            "| Path | Reason |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            "| --- | --- |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            foreach ($entry in $exclusions) {
              $safePath = $entry.Path.Replace("|", "\|")
              $safeReason = $entry.Reason.Replace("|", "\|")
              ('| `{0}` | {1} |' -f $safePath, $safeReason) |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            }
          }

          foreach ($entry in $exclusions) {
            Add-MpPreference -ExclusionPath $entry.Path -ErrorAction Stop
          }

          $prefs = Get-MpPreference
          foreach ($entry in $exclusions) {
            if ($prefs.ExclusionPath -notcontains $entry.Path) {
              throw "Windows Defender exclusion was not applied: $($entry.Path)"
            }
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: |
            8.0.413
            9.0.301

      - name: Cache NuGet packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.nuget/packages
            ~\AppData\Local\NuGet\packages
          # Locked restore keeps package inputs honest; avoid evicting the cache for project-only test edits.
          # locked restore がパッケージ入力を検証するため、テスト用 project だけの変更ではキャッシュを失効させない。
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # --locked-mode requires every resolved package to match the committed
      # packages.lock.json so an unexpected transitive bump (including silent
      # native swaps under SQLitePCLRaw.bundle_e_sqlite3) fails the build
      # instead of slipping into CI/release artifacts. See issue #1556.
      # --locked-mode は packages.lock.json と完全一致する解決を強制するため、
      # SQLitePCLRaw.bundle_e_sqlite3 の native を含む推移依存の予期せぬ
      # bump が CI / release アーティファクトに紛れ込まずビルド失敗で気付ける。
      # 詳細は issue #1556 参照。
      - name: Restore dependencies
        run: dotnet restore CodeIndex.sln --locked-mode

      - name: Select CI lane
        id: lane
        shell: pwsh
        run: |
          $primaryLane = "${{ matrix.os }}" -eq "ubuntu-latest" -and "${{ matrix.test-framework }}" -eq "net8.0"
          $primaryLaneText = if ($primaryLane) { "true" } else { "false" }
          "primary_lane=$primaryLaneText" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Audit NuGet package vulnerabilities
        if: steps.lane.outputs.primary_lane == 'true'
        shell: pwsh
        run: |
          $auditOutput = dotnet list src/CodeIndex/CodeIndex.csproj package --vulnerable --include-transitive 2>&1
          $auditExitCode = $LASTEXITCODE

          $auditOutput | ForEach-Object { Write-Host $_ }

          if ($auditExitCode -ne 0) {
            exit $auditExitCode
          }

          if ($auditOutput -match '\b(High|Critical)\b') {
            throw "High or critical NuGet vulnerability detected."
          }

      - name: Verify Release solution build
        if: steps.lane.outputs.primary_lane == 'true'
        run: dotnet build CodeIndex.sln --configuration Release --no-restore -p:UseSharedCompilation=false

      - name: Verify developer task wrapper
        if: steps.lane.outputs.primary_lane == 'true'
        run: make lint

      - name: Build
        if: steps.lane.outputs.primary_lane != 'true'
        run: dotnet build tests/CodeIndex.Tests/CodeIndex.Tests.csproj --configuration Release --framework ${{ matrix.test-framework }} --no-restore

      - name: Test
        id: test
        shell: pwsh
        run: |
          $testArgs = @(
            "test",
            "tests/CodeIndex.Tests/CodeIndex.Tests.csproj",
            "--configuration", "Release",
            "--framework", "${{ matrix.test-framework }}",
            "--no-build",
            "--no-restore",
            "--nologo",
            "--settings", "tests/CodeIndex.Tests/CodeIndex.Tests.runsettings",
            "--blame-crash",
            "--blame-hang",
            "--blame-hang-timeout", "5m",
            "--logger", "trx;LogFileName=test_results.trx"
          )

          $collectCoverage = "${{ steps.lane.outputs.primary_lane }}" -eq "true"
          if ($collectCoverage) {
            $testArgs += @("--collect", "XPlat Code Coverage")
          } else {
            Write-Host "Skipping XPlat Code Coverage outside ubuntu-latest/net8.0 so platform/framework matrix lanes run only the test suite."
          }

          function Invoke-TestRun {
            param(
              [Parameter(Mandatory = $true)]
              [string]$LogPath
            )

            $capturedOutput = [System.Collections.Generic.List[string]]::new()
            dotnet @testArgs 2>&1 | ForEach-Object {
              $line = [string]$_
              $capturedOutput.Add($line)
              Write-Host $line
            }

            $exitCode = $LASTEXITCODE
            if ($exitCode -ne 0) {
              [System.IO.File]::WriteAllLines($LogPath, [string[]]$capturedOutput)
            }

            return $exitCode
          }

          New-Item -ItemType Directory -Force -Path ./TestResults | Out-Null
          $firstLogPath = Join-Path "./TestResults" "test-output-first.txt"
          $firstExitCode = Invoke-TestRun -LogPath $firstLogPath
          if ($firstExitCode -eq 0) {
            exit 0
          }

          "summarize=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          if (Select-String -Path $firstLogPath -SimpleMatch "test run timeout" -Quiet) {
            Write-Warning "Initial test run hit TestSessionTimeout; skipping flaky retry to keep CI bounded. Inspect uploaded TRX/blame artifacts."
            exit $firstExitCode
          }

          Write-Warning "Initial test run failed with exit code $firstExitCode. Rerunning once to classify possible flakiness."
          $retryLogPath = Join-Path "./TestResults" "test-output-retry.txt"
          $retryExitCode = Invoke-TestRun -LogPath $retryLogPath
          if ($retryExitCode -eq 0) {
            "Initial test run failed, but the single retry passed. Treat this run as flaky and inspect TRX/blame artifacts." |
              Set-Content -Encoding UTF8 ./TestResults/flaky-retry.txt
            Write-Warning "Tests passed on retry; uploaded TestResults include flaky-retry.txt."
            exit 0
          }

          exit $retryExitCode

      - name: Summarize TRX telemetry
        if: always() && (steps.test.outputs.summarize == 'true' || failure())
        run: dotnet run --project tools/CodeIndex.TestTelemetry -- summarize --results-directory ./TestResults --top 10

      - name: Upload test results
        if: always() && (steps.test.outputs.summarize == 'true' || failure())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TestResults-${{ matrix.os }}-${{ matrix.test-framework }}
          if-no-files-found: warn
          overwrite: true
          path: |
            TestResults/**/*.trx
            TestResults/**/*.txt
            TestResults/**/*.xml
            TestResults/**/*Sequence*.xml

      - name: Upload diagnostic dumps
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: DiagnosticDumps-${{ matrix.os }}-${{ matrix.test-framework }}
          if-no-files-found: ignore
          overwrite: true
          path: |
            TestResults/**/*.dmp
            TestResults/**/*.dump
            TestResults/**/*.hangdump

      - name: Upload coverage reports
        if: always() && steps.lane.outputs.primary_lane == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Coverage-${{ matrix.os }}-${{ matrix.test-framework }}
          if-no-files-found: warn
          overwrite: true
          path: TestResults/**/coverage.cobertura.xml

      - name: Publish
        if: steps.lane.outputs.primary_lane == 'true'
        run: dotnet publish src/CodeIndex/CodeIndex.csproj --configuration Release --no-build --output publish

      - name: Upload build artifact
        if: steps.lane.outputs.primary_lane == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CodeIndex
          overwrite: true
          path: publish/**
